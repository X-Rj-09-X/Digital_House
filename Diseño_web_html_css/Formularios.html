<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Proyecto Diseño Web Digital House</title>


</head>
<body>
    <h1>FORMULARIOS</h1>

    <form>
        <!-- INPUT TYPE TEX -->
         <h4>Datos personales</h4>
        <label for="Nombre">Nombre</label>
        <input type="text" name="Nombre" id="Nombre">
        <label for="Apellido">Apellido</label>
        <input type="text" name="Apellido" id="Apellido">
        <br>
        <br>
        <!-- INPUT RADIO BOTON -->
         <h4>Situacion Laboral</h4>
         <label for="Empleado">Empleado</label>
         <input type="radio" name="Situacion-Laboral" id="Empleado" value="Empleado">
         <label for="Desempleado">Desempleado</label>
         <input type="radio" name="Situacion-Laboral" id="Desempleado" value="Desempleado">
         <label for="Busqueda">En busqueda activa</label>
         <input type="radio" name="Situacion-Laboral" id="Busqueda" value="Busqueda">
         <br>
         <br>
         <!-- INPUT TYPE CHECKBOX -->
          <h4>Tecnologias que manejas</h4>
          <label for="html">HTML</label>
          <input type="checkbox" name="Tecnologias" id="html" value="html">
          <label for="css">CSS</label>
          <input type="checkbox" name="Tecnologias" id="css" value="css">
          <label for="javascript">JavaScript</label>
          <input type="checkbox" name="Tecnologias" id="javascript" value="javascript">
          <label for="react">REACT</label>
          <input type="checkbox" name="Tecnologias" id="react" value="react">
          <!-- TEXTAREA -->
           <br>
           <br>
           <label for="motivo">Motivo:</label>
           <br>
           <textarea name="motivo" id="motivo" cols="30" rows="10"></textarea>
          <!-- IMPUT TYPE SUBMIT -->
           <br>
           <br>
           <input type="submit" value="Enviar">

    </form>

</body>
</html>
