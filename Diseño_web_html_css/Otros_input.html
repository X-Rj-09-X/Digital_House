<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Proyecto Diseño Web Digital House</title>


</head>
<body>
    <h1>FORMULARIOS</h1>

    <form method="get">
        <label for="color">Seleccione un color:</label>
        <input type="color" name="color" id="color">
        <br>
        <br>
        <label for="fecha">Seleccione una fecha:</label>
        <input type="date" name="fecha" id="fecha">
        <br>
        <br>
        <label for="hora">Seleccione una hora:</label>
        <input type="time" name="hora" id="hora">
        <br>
        <br>
        <label for="number">Seleccione un numero:</label>
        <input type="number" name="numero" id="numero" min="1" max="10">
        <br>
        <br>
        <label for="range">Seleccione un rango:</label>
        <input type="range" name="rango" id="rango">
        <br>
        <br>
        <label for="file">Seleccione un archivo:</label>
        <input type="file" name="archivo" id="archivo">
        <br>
        <br>
        <input type="submit" value="Enviar">
    </form>

</body>
</html>
